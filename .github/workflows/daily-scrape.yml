name: Daily price scrape

# Runs the two sandbox scrapers, whose sites invite scraping, and collects the
# European Central Bank's daily reference rates. The schedule is switched off;
# restore the two lines below to turn it back on. The ECB publishes at about
# 16:00 CET on working days, so the suggested time is after that, Monday to Friday.
#   schedule:
#     - cron: "0 16 * * 1-5" # weekdays at 16:00 UTC
on:
  workflow_dispatch: # runnable by hand from the Actions tab

permissions:
  contents: write # to commit the updated data/ files

concurrency: daily-scrape

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Tests
        run: |
          python test_report.py
          python test_sandbox.py
          python test_rates.py

      # Each scraper may fail without stopping the others; the last step reports it.
      - name: Books (multi-page)
        id: books
        continue-on-error: true
        run: |
          python scrape_books.py --out books.csv
          python report.py --name books --current books.csv

      - name: Countries (single page)
        id: countries
        continue-on-error: true
        run: python scrape_countries.py --out data/countries_latest.csv

      - name: Euro exchange rates (changes daily)
        id: rates
        continue-on-error: true
        run: |
          python scrape_rates.py --out rates.csv
          python report.py --name euro --current rates.csv --measure rate --items currencies \
            --symbol "" --source "European Central Bank, euro foreign exchange reference rates"

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Daily price data $(date -u +%F)"
          git push

      - name: Fail the run if a scraper failed
        if: steps.books.outcome == 'failure' || steps.countries.outcome == 'failure' || steps.rates.outcome == 'failure'
        run: exit 1
